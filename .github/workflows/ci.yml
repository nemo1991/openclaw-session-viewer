name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "*.md"
      - "docs/**"
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - "*.md"
      - "docs/**"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test (Ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # 不指定 node-version,使用 runner 默认(当前为 Node 24)
          cache: pnpm

      - name: Install system deps (webkit2gtk-4.1)
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Node deps
        run: pnpm install --frozen-lockfile

      - name: Test (Rust)
        working-directory: src-tauri
        run: cargo test --lib

      # v0.10 (FR-T2): cargo test 会刷新 packages/shared/src/generated 下的
      # ts-rs 类型与 Rust 归一化契约快照。产物必须与仓库里提交的版本一致,
      # 否则说明有人改了 Rust 结构体却没重新生成 —— 直接阻断合并。
      # 放在 Typecheck 之前:让结构断言吃到刚生成的类型。
      - name: Verify generated schema / contract snapshot (FR-T2)
        run: git diff --exit-code -- packages/shared/src/generated/

      # v0.10 (FR-T1 / A4): shared/src/schema-assert.ts 真实 import 生成类型,
      # Rust 新增/重命名字段而 shared 手写类型未同步 → typecheck 失败。
      - name: Typecheck (incl. Rust↔TS schema assertions)
        run: pnpm typecheck

      # v0.10 (FR-T3 / A4): 断言渲染层没有回退到 FE 弱类型
      - name: Assert no FE weak types (FR-T3)
        run: pnpm assert:no-fe-types

      - name: Test (TS)
        working-directory: packages/shared
        run: pnpm test

      # v0.7.0:Frontend vitest 跑(之前 CI 只跑 shared,漏掉 frontend 397+ 测试)
      - name: Test (TS frontend)
        working-directory: packages/frontend
        run: pnpm test

      # v0.7.0:vitest coverage(v8)— 跑全量测试,生成 text + html + json-summary
      # HTML 报告作为 artifact 上传 7 天,便于 PR review 时点开看覆盖度
      - name: Test (TS coverage)
        working-directory: packages/frontend
        run: pnpm test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: packages/frontend/coverage/
          retention-days: 7

      # v0.7.0:Playwright E2E(9 case:content-filter.spec.ts)
      # 用 ubuntu 自带 chromium,装 playwright browsers via npx
      - name: Install Playwright browsers
        working-directory: packages/frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Build for E2E
        run: pnpm build

      # Playwright E2E(纯前端 vite preview,Tauri invoke 全 mock,见 playwright.config.ts)。
      # 历史:v0.7.0 时部分 spec 在 vite preview 下失败(14/22),CI 用 continue-on-error 放行;
      # 此后各 spec 改用 ?path= 构造最小 meta 绕过 SessionDetailRoute 的 notFound 分支,
      # 且 global-setup(./e2e/global-setup.ts)已跨平台化(preview 由它托管/复用/teardown 清理),
      # 当前 E2E 稳定 20/20。故移除放行策略,让失败真正阻塞流水线。
      - name: E2E (Playwright)
        working-directory: packages/frontend
        run: pnpm exec playwright test --config ../../playwright.config.ts

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/frontend/playwright-report/
          retention-days: 7

  lint:
    name: Lint & Format Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # 不指定 node-version,使用 runner 默认(当前为 Node 24)
          cache: pnpm

      - name: Install system deps (GTK for clippy build scripts)
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - uses: dtolnay/rust-toolchain@stable

      - run: pnpm install --frozen-lockfile

      - name: Rust format check
        working-directory: src-tauri
        run: cargo fmt -- --check

      - name: Rust clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
